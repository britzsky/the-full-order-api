spring.application.name=the-full-api
server.port=8090

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://the-full-db.c7qw8eqkk298.ap-southeast-2.rds.amazonaws.com:3306/the_full_order?serverTimezone=UTC&characterEncoding=UTF-8

spring.datasource.username=
spring.datasource.password=

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

mybatis.mapper-locations=classpath:mybatis-mapper/**/*.xml
mybatis.type-aliases-package=com.example.demo.dao

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

google.cloud.vision.credentials.path=

documentai.project.id=
documentai.location=
#documentai.processor.id=

openai.api.key=

logging.level.root=info
logging.level.com.example=debug
logging.level.org.springframework.jdbc=debug
logging.level.org.mybatis=debug
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=DEBUG

# 비밀 정보는 아래 파일로 분리
spring.config.import=optional:file:/opt/thefull-config/application-secret-real.properties

server.servlet.context-path=/api

file.upload-dir=/opt/thefull/uploads/image/

# Welstory FD API - real
welstory.api.base-url=
welstory.api.token-url=
welstory.api.revoke-url=
welstory.api.realtime-item-url=
welstory.api.access-token=
welstory.api.client-id=
welstory.api.client-secret=
welstory.api.timeout-seconds=
welstory.websocket.enabled=
welstory.websocket.url=


# 웰스토리 순기 판가 새벽 배치(오늘·다음 순기: 안 받은 순기는 전체, 받은 순기는 변경 판가). 서버 여러 대면 한 대만 true
welstory.cycle-sync.enabled=true

# 공급사 자동 배치(SupplierSyncScheduler). 서버 여러 대면 한 대만 true
# 납품일 상품 준비 03:10 — 7일 안 식단 날짜 + 아워홈 연결 거래처의 가까운 발주 가능일 2일
supplier.sync.catalog.enabled=true
# 아워홈 사업장 마스터 매주 월 03:00 (사업장 목록만, 거래처 연결 안 함)
ourhome.site-sync.enabled=true
# 아워홈 출고·삭제 상태 확인 07~20시 매시 40분 → 업무 알림 (재고 반영 없음)
ourhome.shipment-check.enabled=true
# 접수 불명확 주문 자동 대사 06~22시 20분 간격
supplier.order-reconcile.enabled=true
# 웰스토리 입고 대사(재고 반영) — 실제 입고 데이터 검증 후 true
supplier.sync.receipts.enabled=false

# 카카오 알림톡(Solapi 대행) — docs/KAKAO_ALIMTALK_SETUP.md. 키·시크릿은 서버 비밀 설정 파일에만 둘 것
kakao.alimtalk.enabled=false
